[workspace]
resolver = "2"
members = ["core", "wasm"]
# The frame-time bench builds wasmtime: its own workspace (bench/README in its main.rs).
exclude = ["bench"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.2"

[profile.release]
# Let LLVM inline the core painter across the WASM crate boundary. Calls and
# repeated slice checks are particularly expensive on Pulley.
lto = true
codegen-units = 1
