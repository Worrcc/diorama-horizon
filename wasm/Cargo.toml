[package]
name = "diorama"
description = "Diorama minimap port, wasm32 Horizon client mod"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
diorama-core = { path = "../core" }
# The Horizon-iOS fork's SDK at API level 17 (canvas + client-world), branch
# claude/mod-canvas-api. Upstream Horizon has no WASM mods.
horizon-mod-sdk = { git = "https://github.com/Worrcc/Horizon-iOS-worc", rev = "5082b61b08c8dcf628e18accfe2fbe667bfee57d" }
