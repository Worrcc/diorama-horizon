id = "diorama"
name = "Diorama"
version = "0.4.0"
description = "Unofficial port of the Diorama minimap (MIT, Dara Adedeji). An angled minimap of the loaded chunks, coloured from your resource packs, that you can move anywhere on screen, a fullscreen map (M), caves and the Nether, zoom and waypoints."
authors = ["Worrcc", "Dara Adedeji (Diorama)"]
api = "0.1"
side = "client"
capabilities = ["game-read", "render", "world-read", "input", "ui", "storage", "chat", "command"]
experimental = ["render", "world-read", "input", "ui"]
storage-mb = 1024
